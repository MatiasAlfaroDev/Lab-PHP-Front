<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cita.Pro — Sin conexión</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eeece4;
      color: #1c1c1c;
      font-family: "Geist", "Inter", ui-sans-serif, system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 320px; }
    .logo {
      width: 40px; height: 40px; border-radius: 6px;
      background: #2b2d3a; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 20px; margin: 0 auto 16px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #6b6b6b; margin: 0 0 20px; }
    button {
      background: #1c1c1c; color: #fff; border: none;
      padding: 10px 20px; border-radius: 10px; font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">+</div>
    <h1>Sin conexión</h1>
    <p>No pudimos conectar con Cita.Pro. Revisá tu conexión a internet e intentá de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
